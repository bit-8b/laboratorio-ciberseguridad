{% extends "base.html" %}
{% block title %}Iniciar sesión · Laboratorio MTTD / MTTR{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Iniciar sesión</h1>
  <p class="muted">Accede al panel de incidentes y eventos de seguridad.</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" maxlength="64" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <p><button type="submit">Entrar</button></p>
  </form>
  <p>¿Primera vez? <a href="{{ url_for('register') }}">Crear una cuenta</a></p>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Crear cuenta · Laboratorio MTTD / MTTR{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Crear cuenta</h1>
  <p class="muted">Las contraseñas se guardan mediante hash; no se almacenan en texto plano.</p>
  <form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" minlength="4" maxlength="20" pattern="[A-Za-z0-9_.-]{4,20}" required>
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <p class="muted">Usa entre 8 y 128 caracteres.</p>
    <p><button type="submit">Registrarme</button></p>
  </form>
  <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
</section>
{% endblock %}
